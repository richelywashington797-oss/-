<script>
let items=[],editing,folder='',generation=0;
async function refresh(){

 try{const r=await fetch('/api/catalog',{cache:'no-store'});if(!r.ok)throw Error();
 const fresh=await r.json();if(seq!==generation)return;
 items=fresh;if(folder&&!items.some(x=>x.id===folder))folder='';render();syncState.textContent='云端共享';
 }catch{syncState.textContent='连接中断 · 重试中';setTimeout(refresh,4000)}
}

}
async function change(values,file){

 if(!r.ok){if(r.status===403)sessionStorage.removeItem('editKey');const err=await r.json().catch(()=>({}));throw Error(err.error||'保存失败，请检查连接或文件大小')}

 }catch(e){alert(e.message);return false}

try{if(await change({id:folderTarget?.id||crypto.randomUUID(),version:folderTarget?.version||0,title:folderName.value,kind:'folder'}))folderModal.close()}finally{button.disabled=false}};newFolder.onclick=()=>nameFolder();

 count.textContent=matches.length;

function authorDuck(name){
 const faceNames=['开心','生气','沮丧','流泪'];
 const presets=['置物架','鸭子','猪','中文'];
 const known=presets.indexOf(name);
 let hash=0;for(const char of name||'')hash=(Math.imul(hash,31)+char.codePointAt(0))>>>0;
 const mood=faceNames[known>=0?known:hash%4];
 const svg=document.querySelector('#brandDuck svg').cloneNode(true);
 svg.classList.add('author-duck');svg.dataset.mood=mood;
 for(const face of svg.querySelectorAll('[data-face]'))if(face.dataset.face!==mood)face.remove();
 return svg
}

 const flock=new Map(),path=[];
 let pointer=null;
 function drawFlock(dt,now){
   while(path.length&&now-path[0].t>1000)path.shift();
   const step=112,cols=Math.ceil(width/step)+2,rows=Math.ceil(height/step)+2;
   for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
     const phase=(i*7+j*11)*.79;
     const x=(i*step+j%2*48+clock*9)%(cols*step)-step;
     const y=(j*step+clock*3.3)%(rows*step)-step+Math.sin(clock+phase)*5;
     if(x< -55||x>width+55||y< -55||y>height+55)continue;
     const key=j*65536+i;
     let bird=flock.get(key);
     if(!bird){bird={dx:0,dy:0,tilt:0,glow:0};flock.set(key,bird)}
     let tx=0,ty=0,turn=0,total=0,nearGlow=0;
     for(let n=path.length-1;n>=0;n--){
       const s=path[n],rx=x-s.x,ry=y-s.y;

       const weight=Math.exp(-(along*along+across*across)/29000)*Math.sin(Math.PI*age/.8)**2*s.speed;

       const dx=x+bird.dx-pulse.x,dy=y+bird.dy-pulse.y;
       const distance=Math.hypot(dx,dy);
       const heading=Math.atan2(dy,dx)-pulse.heading;
       // The bend grows with distance, so neighboring ducks share the same flowing front.
       const bend=.68*Math.sin(distance/190+pulse.twist);

     }

     ctx.restore()
   }
 } function draw(now){

 function disturb(e,hover){

 const x=e.clientX,y=e.clientY,now=performance.now();

   const dx=x-pointer.x,dy=y-pointer.y,length=Math.hypot(dx,dy),elapsed=now-pointer.t;
   if(elapsed<18||length<3)return;
   const steps=Math.min(6,Math.ceil(length/54));
   for(let k=1;k<=steps;k++)path.push({x:pointer.x+dx*k/steps,y:pointer.y+dy*k/steps,ux:dx/length,uy:dy/length,t:now,speed:Math.min(1,length/Math.max(1,elapsed))});
