services:
  - type: web
    name: art-share-library
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 48 --timeout 120 app:app
    disk:
      name: art-content
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: EDIT_KEY
        sync: false
